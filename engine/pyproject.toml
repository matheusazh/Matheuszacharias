[project]
name = "splitter-engine"
version = "0.1.0"
description = "Motor de IA do MusicSplit: separação de faixas, limpeza de fala e análise musical"
requires-python = ">=3.12,<3.13"
dependencies = [
    "audio-separator[cpu]==0.47.0",
    "beat-this==1.1.0",
    "librosa==1.0.0",
    "pyloudnorm==0.2.0",
    "soundfile==0.14.0",
    "mlx-whisper==0.4.3",
    "audioread>=3.0",
    "lv-chordia==1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["splitter_engine"]
