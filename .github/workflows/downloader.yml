name: Downloader

# Compila o Downloader num Mac da nuvem e publica o .dmg como artefato do run.
on:
  push:
    paths: ["Downloader/**", ".github/workflows/downloader.yml"]
  pull_request:
    paths: ["Downloader/**", ".github/workflows/downloader.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: Downloader

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [[ -n "$xcode" ]] && sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Ferramentas embutidas (yt-dlp, deno, ffmpeg)
        run: scripts/fetch-tools.sh

      - name: Compilar e gerar o DMG
        run: scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Downloader-dmg
          path: Downloader/build/*.dmg
          if-no-files-found: error
